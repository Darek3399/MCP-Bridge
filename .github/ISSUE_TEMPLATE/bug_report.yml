name: Bug report
description: Report a reproducible problem with MCP Bridge.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove private paths, tokens, credentials, tunnel URLs, and personal data from logs before posting.
  - type: input
    id: version
    attributes:
      label: MCP Bridge version
      placeholder: "e.g. 0.8.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "e.g. Windows 11 x64"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open MCP Bridge
        2. Add or enable a server
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove personal and sensitive information before sharing.
      render: text
    validations:
      required: false