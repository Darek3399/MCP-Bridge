name: Publish to WinGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 0.9.90)'
        required: true
        type: string

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: windows-latest
    steps:
      - name: Resolve tag and version
        id: meta
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.event.release.tag_name }}" }
          $ver = $tag.TrimStart('v', 'V')
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Submit update PR to winget-pkgs
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: Darek3399.MCPHotplug
          version: ${{ steps.meta.outputs.version }}
          release-tag: ${{ steps.meta.outputs.tag }}
          installers-regex: '\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}