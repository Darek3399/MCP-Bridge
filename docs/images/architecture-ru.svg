
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Как работает MCP Bridge</title>
  <desc id="desc">Архитектурная схема: браузерные и настольные ИИ-клиенты подключаются через единый узел MCP Bridge к локальным и облачным MCP-серверам.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141719"/>
      <stop offset="1" stop-color="#101214"/>
    </linearGradient>
    <linearGradient id="hubFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2221"/>
      <stop offset="1" stop-color="#171C1D"/>
    </linearGradient>
    <linearGradient id="gatewayFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2B28"/>
      <stop offset="1" stop-color="#192320"/>
    </linearGradient>
    <linearGradient id="hotSwapFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22272A"/>
      <stop offset="1" stop-color="#1D2225"/>
    </linearGradient>
    <linearGradient id="guardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A261D"/>
      <stop offset="1" stop-color="#211F1A"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".025" stroke-width="1"/>
    </pattern>
    <marker id="arrowMint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#75CDB1"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8C9AA0"/>
    </marker>
    <clipPath id="browserCardClip"><rect x="64" y="238" width="300" height="186" rx="9"/></clipPath>
    <clipPath id="desktopCardClip"><rect x="64" y="500" width="300" height="186" rx="9"/></clipPath>
    <clipPath id="hubCardClip"><rect x="435" y="226" width="730" height="476" rx="12"/></clipPath>
    <clipPath id="localToolsCardClip"><rect x="1226" y="238" width="310" height="186" rx="9"/></clipPath>
    <clipPath id="httpCloudCardClip"><rect x="1226" y="500" width="310" height="186" rx="9"/></clipPath>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 31px; font-weight: 750; letter-spacing: .2px; fill: #F2F4F3; }
      .zone { font-size: 12px; font-weight: 750; letter-spacing: 1.8px; fill: #AAB2B6; }
      .zoneNo { fill: #75CDB1; }
      .cardTitle { font-size: 22px; font-weight: 700; fill: #F1F3F2; }
      .cardSub { font-size: 14px; font-weight: 450; fill: #A6AFB3; }
      .transport { font-size: 11px; font-weight: 750; letter-spacing: 1.05px; }
      .hubTitle { font-size: 21px; font-weight: 720; fill: #F3F5F4; }
      .hubMeta { font-size: 11px; font-weight: 700; letter-spacing: 1.55px; fill: #8E9B98; }
      .stepNo { font-size: 12px; font-weight: 750; letter-spacing: .6px; }
      .stepTitle { font-size: 20px; font-weight: 720; fill: #F3F4F3; }
      .feature { font-size: 14px; font-weight: 700; }
      .detail { font-size: 13px; font-weight: 450; fill: #AAB2B5; }
      .micro { font-size: 10px; font-weight: 750; letter-spacing: 1.4px; fill: #778187; }
    </style>
  </defs>

  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>
  <rect x="18" y="18" width="1564" height="684" rx="8" fill="none" stroke="#343A3F" stroke-width="1"/>

  <text x="64" y="98" class="title" style="font-size:31px">КАК <tspan fill="#75CDB1">РАБОТАЕТ MCP BRIDGE</tspan></text>
  <line x1="64" y1="134" x2="1536" y2="134" stroke="#343A3F" stroke-width="1"/>

  <g id="architecture" transform="translate(0 -32)">
    <text x="64" y="207" class="zone"><tspan class="zoneNo">01</tspan><tspan dx="10">ИИ-КЛИЕНТЫ</tspan></text>
    <text x="435" y="207" class="zone"><tspan class="zoneNo">02</tspan><tspan dx="10">УЗЕЛ MCP BRIDGE</tspan></text>
    <text x="1226" y="207" class="zone"><tspan class="zoneNo">03</tspan><tspan dx="10">MCP-СЕРВЕРЫ</tspan></text>

    <g id="browser-ai">
      <rect x="64" y="238" width="300" height="186" rx="9" fill="#1B2022"/>
      <rect x="64" y="238" width="7" height="186" fill="#75CDB1" clip-path="url(#browserCardClip)"/>
      <rect x="64" y="238" width="300" height="186" rx="9" fill="none" stroke="#38413F" stroke-width="1.2"/>
      <rect x="88" y="260" width="122" height="25" rx="4" fill="#15322F"/>
      <text x="149" y="277" text-anchor="middle" class="transport" fill="#9ADCC7">HTTPS-ТУННЕЛЬ</text>
      <g transform="translate(308 262)" fill="none" stroke="#75CDB1" stroke-width="1.5" opacity=".9">
        <rect x="-17" y="-11" width="34" height="24" rx="3"/>
        <line x1="-17" y1="-4" x2="17" y2="-4"/>
        <circle cx="-11" cy="-7.5" r="1" fill="#75CDB1" stroke="none"/>
        <circle cx="-6" cy="-7.5" r="1" fill="#75CDB1" stroke="none"/>
      </g>
      <text x="88" y="336" class="cardTitle">Браузерный ИИ</text>
      <text x="88" y="367" class="cardSub">ChatGPT  ·  Claude Web</text>
      <line x1="88" y1="391" x2="340" y2="391" stroke="#343C3F"/>
      <text x="88" y="410" class="micro">УДАЛЁННЫЕ КЛИЕНТЫ</text>
    </g>

    <g id="desktop-ides">
      <rect x="64" y="500" width="300" height="186" rx="9" fill="#1B2022"/>
      <rect x="64" y="500" width="7" height="186" fill="#8C9AA0" clip-path="url(#desktopCardClip)"/>
      <rect x="64" y="500" width="300" height="186" rx="9" fill="none" stroke="#38413F" stroke-width="1.2"/>
      <rect x="88" y="522" width="132" height="25" rx="4" fill="#252B2E" stroke="#465158" stroke-width=".8"/>
      <text x="154" y="539" text-anchor="middle" class="transport" fill="#C1C9CC">ЛОКАЛЬНЫЙ ПОРТ</text>
      <g transform="translate(308 525)" fill="none" stroke="#9CAAB0" stroke-width="1.5" opacity=".9">
        <rect x="-17" y="-12" width="34" height="23" rx="2.5"/>
        <path d="M-7 16H7M0 11V16"/>
      </g>
      <text x="88" y="598" class="cardTitle">Десктоп и IDE</text>
      <text x="88" y="629" class="cardSub">Claude  ·  Cursor  ·  Codex</text>
      <line x1="88" y1="653" x2="340" y2="653" stroke="#343C3F"/>
      <text x="88" y="672" class="micro">ЛОКАЛЬНЫЕ КЛИЕНТЫ</text>
    </g>

    <g id="mcp-bridge-hub">
      <rect x="435" y="226" width="730" height="476" rx="12" fill="url(#hubFill)"/>
      <rect x="435" y="226" width="730" height="8" fill="#75CDB1" opacity=".82" clip-path="url(#hubCardClip)"/>
      <rect x="435" y="226" width="730" height="476" rx="12" fill="none" stroke="#3E6258" stroke-width="1.3"/>
      <text x="468" y="272" class="hubTitle">MCP Bridge</text>
      <text x="468" y="296" class="hubMeta">ЕДИНЫЙ СЛОЙ МАРШРУТИЗАЦИИ</text>
      <g transform="translate(998 251)">
        <rect width="132" height="27" rx="4" fill="#15322F" stroke="#315B50" stroke-width=".8"/>
        <circle cx="14" cy="13.5" r="3" fill="#75CDB1"/>
        <text x="28" y="18" class="transport" fill="#9ADCC7">ЕДИНАЯ ТОЧКА</text>
      </g>
      <line x1="468" y1="315" x2="1132" y2="315" stroke="#35413F" stroke-width="1"/>

      <g id="zero-tax-gateway">
        <rect x="468" y="344" width="204" height="312" rx="7" fill="url(#gatewayFill)" stroke="#35584E" stroke-width="1"/>
        <rect x="488" y="364" width="36" height="30" rx="4" fill="#15322F" stroke="#3F7665" stroke-width=".8"/>
        <text x="506" y="384" text-anchor="middle" class="stepNo" fill="#9ADCC7">01</text>
        <text x="488" y="435" class="stepTitle">Экономный</text>
        <text x="488" y="461" class="stepTitle">шлюз</text>
        <line x1="488" y1="483" x2="652" y2="483" stroke="#3D6559" stroke-width="1.2"/>
        <text x="488" y="521" class="feature" fill="#9ADCC7" style="font-size:13px">Всего 2 инструмента</text>
        <text x="488" y="552" class="detail">Экономит ~95%</text>
        <text x="488" y="572" class="detail">токенов промпта</text>
        <text x="488" y="626" class="micro">КОМПАКТНЫЙ НАБОР</text>
      </g>

      <g id="live-hot-swap">
        <rect x="698" y="344" width="204" height="312" rx="7" fill="url(#hotSwapFill)" stroke="#3B474B" stroke-width="1"/>
        <rect x="718" y="364" width="36" height="30" rx="4" fill="#252B2E" stroke="#526168" stroke-width=".8"/>
        <text x="736" y="384" text-anchor="middle" class="stepNo" fill="#C1C9CC">02</text>
        <text x="718" y="435" class="stepTitle">Смена</text>
        <text x="718" y="461" class="stepTitle">серверов</text>
        <line x1="718" y1="483" x2="882" y2="483" stroke="#4A565B" stroke-width="1.2"/>
        <text x="718" y="521" class="feature" fill="#C1C9CC">Смена в 1 клик</text>
        <text x="718" y="552" class="detail">Прямо во время чата</text>
        <text x="718" y="572" class="detail">без перезагрузки</text>
        <text x="718" y="626" class="micro">КОНТРОЛЬ СЕРВЕРОВ</text>
      </g>

      <g id="folder-ram-guard">
        <rect x="928" y="344" width="204" height="312" rx="7" fill="url(#guardFill)" stroke="#6A542D" stroke-width="1"/>
        <rect x="948" y="364" width="36" height="30" rx="4" fill="#332915" stroke="#806633" stroke-width=".8"/>
        <text x="966" y="384" text-anchor="middle" class="stepNo" fill="#E0BB72">03</text>
        <text x="948" y="435" class="stepTitle">Защита папок</text>
        <text x="948" y="461" class="stepTitle">и памяти</text>
        <line x1="948" y1="483" x2="1112" y2="483" stroke="#6A542D" stroke-width="1.2"/>
        <text x="948" y="521" class="feature" fill="#E0BB72">Безопасный доступ</text>
        <text x="948" y="552" class="detail">Правила для папок</text>
        <text x="948" y="572" class="detail">без утечек RAM</text>
        <text x="948" y="626" class="micro">ДОСТУП И ПРОЦЕССЫ</text>
      </g>

      <path d="M676 500H694" fill="none" stroke="#75CDB1" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowMint)"/>
      <path d="M906 500H924" fill="none" stroke="#75CDB1" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowMint)"/>
    </g>

    <path d="M364 331H388C399 331 408 340 408 351V462" fill="none" stroke="#75CDB1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M364 593H388C399 593 408 584 408 573V462" fill="none" stroke="#8C9AA0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="408" cy="462" r="4" fill="#75CDB1"/>
    <path d="M408 462H435" fill="none" stroke="#75CDB1" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrowMint)"/>
    <g transform="translate(320 445)">
      <rect x="0" y="-15" width="58" height="22" rx="4" fill="#15322F" stroke="#315B50" stroke-width=".8"/>
      <text x="29" y="0" text-anchor="middle" class="transport" fill="#9ADCC7">1 СВЯЗЬ</text>
    </g>

    <path d="M1165 462H1188" fill="none" stroke="#75CDB1" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M1188 462V351C1188 340 1197 331 1208 331H1226" fill="none" stroke="#75CDB1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowMint)"/>
    <path d="M1188 462V573C1188 584 1197 593 1208 593H1226" fill="none" stroke="#8C9AA0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowSlate)"/>
    <circle cx="1188" cy="462" r="4.4" fill="#75CDB1" stroke="#171C1D" stroke-width="1.2"/>

    <g id="local-tools">
      <rect x="1226" y="238" width="310" height="186" rx="9" fill="#1B2022"/>
      <rect x="1226" y="238" width="7" height="186" fill="#75CDB1" clip-path="url(#localToolsCardClip)"/>
      <rect x="1226" y="238" width="310" height="186" rx="9" fill="none" stroke="#38413F" stroke-width="1.2"/>
      <rect x="1250" y="260" width="164" height="25" rx="4" fill="#15322F"/>
      <text x="1332" y="277" text-anchor="middle" class="transport" fill="#9ADCC7">АВТО STDIO → HTTP</text>
      <g transform="translate(1481 272)" fill="none" stroke="#75CDB1" stroke-width="1.5" opacity=".9">
        <rect x="-13" y="-13" width="26" height="26" rx="4"/>
        <path d="M-7 -5H7M-7 0H7M-7 5H3"/>
      </g>
      <text x="1250" y="336" class="cardTitle" style="font-size:19.5px">Локальные инструменты</text>
      <text x="1250" y="367" class="cardSub">GitHub  ·  Blender  ·  CLI</text>
      <line x1="1250" y1="391" x2="1512" y2="391" stroke="#343C3F"/>
      <text x="1250" y="410" class="micro">ЛОКАЛЬНЫЕ STDIO-СЕРВЕРЫ</text>
    </g>

    <g id="http-cloud">
      <rect x="1226" y="500" width="310" height="186" rx="9" fill="#1B2022"/>
      <rect x="1226" y="500" width="7" height="186" fill="#8C9AA0" clip-path="url(#httpCloudCardClip)"/>
      <rect x="1226" y="500" width="310" height="186" rx="9" fill="none" stroke="#38413F" stroke-width="1.2"/>
      <rect x="1250" y="522" width="108" height="25" rx="4" fill="#252B2E" stroke="#465158" stroke-width=".8"/>
      <text x="1304" y="539" text-anchor="middle" class="transport" fill="#C1C9CC">ПРЯМОЙ HTTP</text>
      <g transform="translate(1481 534)" fill="none" stroke="#9CAAB0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity=".95">
        <path d="M-12 7H10.5C15.2 7 18 3.8 18 0C18 -3.8 14.9 -6.8 10.9 -6.8C9.4 -12.1 4.7 -15 -0.3 -13.6C-4.5 -12.5 -7.2 -9.1 -7.2 -5.3C-11.7 -5.7 -15  -2.6 -15 1C-15 4.4 -13.7 7 -12 7Z"/>
      </g>
      <text x="1250" y="598" class="cardTitle">HTTP и облако</text>
      <text x="1250" y="629" class="cardSub">Плагины IDE  ·  веб-API</text>
      <line x1="1250" y1="653" x2="1512" y2="653" stroke="#343C3F"/>
      <text x="1250" y="672" class="micro">ВНЕШНИЕ HTTP-СЕРВИСЫ</text>
    </g>
  </g>
</svg>
