  <text x="1113" y="198" text-anchor="middle" fill="#D1D5DB" font-family="Segoe UI, Inter, sans-serif" font-size="13">Supergateway + Tailscale Funnel</text>
  <text x="1113" y="220" text-anchor="middle" fill="#34D399" font-family="Consolas, monospace" font-size="12" font-weight="700">✓ Never breaks Windows DNS</text>
  <text x="1113" y="240" text-anchor="middle" fill="#34D399" font-family="Consolas, monospace" font-size="12" font-weight="700">✓ No router port forwarding</text>
  <text x="1113" y="270" text-anchor="middle" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="600">Claude Web • ChatGPT • OpenWebUI</text>

  <!-- Выход 2: Десктопный ИИ -->
  <rect x="976" y="315" width="274" height="185" rx="12" fill="#181E27" stroke="#60A5FA" stroke-width="2"/>
  <rect x="994" y="331" width="238" height="26" rx="6" fill="#1E293B"/>
  <text x="1113" y="349" text-anchor="middle" fill="#93C5FD" font-family="Consolas, monospace" font-size="12.5" font-weight="700">DESKTOP &amp; IDE AI (LOCAL)</text>
  <text x="1113" y="384" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="700">Single Local Endpoint</text>
  <text x="1113" y="408" text-anchor="middle" fill="#93C5FD" font-family="Consolas, monospace" font-size="13">http://localhost:&lt;port&gt;/mcp</text>
  <text x="1113" y="430" text-anchor="middle" fill="#D1D5DB" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">✓ Connect once, no JSON editing</text>
  <text x="1113" y="450" text-anchor="middle" fill="#D1D5DB" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">✓ 1 shared process for all tabs</text>
  <text x="1113" y="480" text-anchor="middle" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="600">Claude • Cursor • OpenCode • Codex</text>
