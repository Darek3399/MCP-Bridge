  <rect x="360" y="132" width="155" height="305" rx="10" fill="#1C2229" stroke="#343D48" stroke-width="1.5"/>
  <rect x="375" y="146" width="125" height="24" rx="5" fill="#15322F"/>
  <text x="437" y="163" text-anchor="middle" fill="#34D399" font-family="Consolas, monospace" font-size="12" font-weight="700">STEP A · GUARD</text>
  <text x="437" y="194" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">OS Sandbox</text>

  <rect x="372" y="212" width="131" height="48" rx="6" fill="#14181D" stroke="#2D353F"/>
  <text x="437" y="232" text-anchor="middle" fill="#34D399" font-family="Consolas, monospace" font-size="12.5" font-weight="700">Job Object</text>
  <text x="437" y="250" text-anchor="middle" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">Kills node.exe tree</text>

  <rect x="372" y="268" width="131" height="48" rx="6" fill="#14181D" stroke="#F59E0B" stroke-width="1"/>
  <text x="437" y="288" text-anchor="middle" fill="#FBBF24" font-family="Consolas, monospace" font-size="12.5" font-weight="700">WAITING Mode</text>
  <text x="437" y="306" text-anchor="middle" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">Sleeps till app starts</text>

  <rect x="372" y="324" width="131" height="48" rx="6" fill="#14181D" stroke="#EF4444" stroke-width="1"/>
  <text x="437" y="344" text-anchor="middle" fill="#F87171" font-family="Consolas, monospace" font-size="12.5" font-weight="700">QUARANTINE</text>
  <text x="437" y="362" text-anchor="middle" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">Isolates broken MCP</text>

  <rect x="372" y="380" width="131" height="44" rx="6" fill="#14181D" stroke="#2D353F"/>
  <text x="437" y="400" text-anchor="middle" fill="#E5E7EB" font-family="Consolas, monospace" font-size="12" font-weight="700">roots-filter</text>
  <text x="437" y="416" text-anchor="middle" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="11">Live folder security</text>

