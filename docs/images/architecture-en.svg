  <rect x="746" y="316" width="122" height="72" rx="8" fill="#0F201E" stroke="#34D399" stroke-width="1.5"/>
  <text x="807" y="346" text-anchor="middle" fill="#34D399" font-family="Consolas, monospace" font-size="16" font-weight="700">call_tool</text>
