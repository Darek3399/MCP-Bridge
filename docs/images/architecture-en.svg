  <text x="623" y="314" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">Live Toggles</text>
  <text x="623" y="334" text-anchor="middle" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">Turn servers ON/OFF</text>

  <rect x="558" y="363" width="131" height="60" rx="6" fill="#14181D" stroke="#2D353F"/>
  <text x="623" y="388" text-anchor="middle" fill="#34D399" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700">No Page Reload</text>
  <text x="623" y="408" text-anchor="middle" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">Switch mid-dialogue</text>

