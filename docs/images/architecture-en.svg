  <text x="1115" y="88" text-anchor="middle" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="1">3. ONE LINK FOR AI (OUTPUT)</text>

