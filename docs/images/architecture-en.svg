  <rect x="340" y="70" width="560" height="435" rx="14" fill="url(#bridgeBg)" stroke="#10B981" stroke-width="2.5"/>
  <rect x="340" y="70" width="560" height="44" rx="14" fill="#15322F"/>
  <text x="620" y="98" text-anchor="middle" fill="#34D399" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800" letter-spacing="0.8">2. MCP BRIDGE CORE (WINDOWS NATIVE HUB)</text>

