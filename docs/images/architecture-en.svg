  <text x="621" y="474" text-anchor="middle" fill="#D1D5DB" font-family="Segoe UI, Inter, sans-serif" font-size="13">All-in-One Installer: <tspan fill="#34D399" font-weight="700">Node.js • uv • Filesystem MCP • Tailscale</tspan> + Auto <tspan fill="#FBBF24" font-family="Consolas, monospace">[REDACTED]</tspan> Logs</text>

  <!-- ==================== ОТДЕЛЬНОЕ ОБЛАЧКО СНИЗУ: COMING SOON ==================== -->
  <line x1="623" y1="437" x2="623" y2="532" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowAmber)"/>
  <rect x="370" y="540" width="500" height="114" rx="14" fill="#211D15" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8,5"/>
  <rect x="390" y="554" width="145" height="24" rx="12" fill="#3B2A14" stroke="#F59E0B"/>
  <text x="462" y="570" text-anchor="middle" fill="#FBBF24" font-family="Consolas, monospace" font-size="12" font-weight="700">⚡ COMING SOON</text>
  <text x="550" y="571" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">Per-Tool Toggle Inside Any Server</text>
  <text x="620" y="604" text-anchor="middle" fill="#E5E7EB" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">Mute individual tools instead of disabling the whole server.</text>
  <text x="620" y="630" text-anchor="middle" fill="#FBBF24" font-family="Consolas, monospace" font-size="13" font-weight="700">Example: GitHub MCP (46 tools) ➔ Mute 40 unused, keep only 6 active</text>

  <!-- ==================== СТРЕЛКИ ВЫХОДА ИЗ ШАГА C НАПРАВО ==================== -->
  <path d="M 882 284 L 930 284 L 930 195 L 968 195" fill="none" stroke="#10B981" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <path d="M 882 284 L 930 284 L 930 405 L 968 405" fill="none" stroke="#60A5FA" stroke-width="3" marker-end="url(#arrowBlue)"/>

