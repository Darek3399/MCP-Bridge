  <path d="M 260 150 L 295 150 L 295 260" fill="none" stroke="#10B981" stroke-width="3"/>
  <path d="M 260 370 L 295 370 L 295 260" fill="none" stroke="#10B981" stroke-width="3"/>
  <line x1="260" y1="260" x2="332" y2="260" stroke="#10B981" stroke-width="3" marker-end="url(#arrowGreen)"/>

