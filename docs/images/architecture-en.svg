  </defs>

  <!-- ФОН -->
  <rect width="1280" height="680" rx="16" fill="url(#bg)" stroke="#2A313C" stroke-width="2"/>

  <!-- ВЕРХНИЙ ЗАГОЛОВОК -->
  <text x="640" y="42" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="22" font-weight="800" letter-spacing="0.5">HOW MCP BRIDGE WORKS (ZERO-TAX HOT-SWAP PIPELINE)</text>

  <!-- ==================== 1. ЛЕВАЯ КОЛОНКА: ВХОД (СЕРВЕРЫ) ==================== -->
  <text x="145" y="88" text-anchor="middle" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="1">1. MANY SERVERS (INPUT)</text>

  <!-- Сервер 1 -->
  <rect x="30" y="105" width="230" height="90" rx="10" fill="#1C2128" stroke="#374151" stroke-width="1.5"/>
  <text x="145" y="138" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">Local STDIO (npx)</text>
  <text x="145" y="162" text-anchor="middle" fill="#34D399" font-family="Consolas, monospace" font-size="13">e.g. GitHub MCP (46 tools)</text>
  <text x="145" y="182" text-anchor="middle" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="12">Node.js bundled</text>

  <!-- Сервер 2 -->
  <rect x="30" y="215" width="230" height="90" rx="10" fill="#1C2128" stroke="#374151" stroke-width="1.5"/>
  <text x="145" y="248" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">Local STDIO (uvx / py)</text>
  <text x="145" y="272" text-anchor="middle" fill="#34D399" font-family="Consolas, monospace" font-size="13">e.g. Blender, IDE, DB</text>
  <text x="145" y="292" text-anchor="middle" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="12">uv &amp; FS MCP bundled</text>

  <!-- Сервер 3 -->
  <rect x="30" y="325" width="230" height="90" rx="10" fill="#1C2128" stroke="#374151" stroke-width="1.5"/>
  <text x="145" y="358" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">Remote HTTP Servers</text>
  <text x="145" y="382" text-anchor="middle" fill="#34D399" font-family="Consolas, monospace" font-size="13">Streamable HTTP / SSE</text>
  <text x="145" y="402" text-anchor="middle" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="12">1-Click Clipboard Import</text>

  <!-- Плашка проблемы без Bridge -->
  <rect x="30" y="435" width="230" height="68" rx="8" fill="#2A1619" stroke="#EF4444" stroke-width="1.2"/>
  <text x="145" y="460" text-anchor="middle" fill="#F87171" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700">Without Bridge:</text>
  <text x="145" y="480" text-anchor="middle" fill="#FCA5A5" font-family="Consolas, monospace" font-size="12">150+ schemas = 60k+ tokens</text>
  <text x="145" y="496" text-anchor="middle" fill="#FCA5A5" font-family="Consolas, monospace" font-size="12">+ Zombie node.exe in RAM</text>

